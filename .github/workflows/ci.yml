name: CI — Linux Matrix (Ubuntu & Fedora) + One-Command Installer

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-ubuntu:
    name: Python & C Suite (Ubuntu Latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libimobiledevice-dev libplist-dev libssl-dev libzip-dev libreadline-dev
      - name: Run Unit & Integration Tests
        run: |
          python3 -m unittest discover -s tests -v
      - name: Verify CLI Subcommands
        run: |
          ./mdmpatcher.py --version
          ./mdmpatcher.py deobfuscate -a assets -o /tmp/deob_check

  test-fedora:
    name: Python & Installer Check (Fedora Container)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora packages via dnf
        run: |
          dnf install -y python3 openssl openssl-libs git bash findutils
      - name: Run Unit & Integration Tests on Fedora
        run: |
          python3 -m unittest discover -s tests -v

  test-installer:
    name: One-Command Installer (curl | bash bootstrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the one-line installer from the current branch
        env:
          # `pull_request` events report the ref as "<pr>/merge"; use the real branch.
          MDM_TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Branch under test: ${MDM_TEST_BRANCH}"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${MDM_TEST_BRANCH}/scripts/install.sh" \
            | bash -s -- --dir "$HOME/mdmpatcher-ci" --branch "${MDM_TEST_BRANCH}"
      - name: Verify the `mdmpatcher` command installed on PATH
        run: |
          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
          ls -l /usr/local/bin/mdmpatcher "$HOME/.local/bin/mdmpatcher" 2>&1 || true
          command -v mdmpatcher || { echo "::error::launcher not found on PATH"; exit 1; }
          mdmpatcher --version
          mdmpatcher deobfuscate -a "$HOME/mdmpatcher-ci/assets" -o /tmp/deob_ci
      - name: Verify `mdmpatcher update` reports an up-to-date checkout
        run: |
          "$HOME/mdmpatcher-ci/.venv/bin/python3" "$HOME/mdmpatcher-ci/mdmpatcher.py" update --no-deps
