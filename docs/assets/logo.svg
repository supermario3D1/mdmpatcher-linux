<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MDMPatcher-Linux Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle App Icon Background -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="4"/>
  <rect x="18" y="18" width="220" height="220" rx="46" fill="url(#glowGrad)"/>

  <!-- Subtle Circuit Grid Lines -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.7">
    <line x1="48" y1="20" x2="48" y2="236"/>
    <line x1="128" y1="20" x2="128" y2="236"/>
    <line x1="208" y1="20" x2="208" y2="236"/>
    <line x1="20" y1="68" x2="236" y2="68"/>
    <line x1="20" y1="128" x2="236" y2="128"/>
    <line x1="20" y1="188" x2="236" y2="188"/>
  </g>

  <!-- Outer Security Shield -->
  <path d="M128 32 L202 62 L202 126 C202 174 169 208 128 224 C87 208 54 174 54 126 L54 62 Z"
        fill="#0f172a" fill-opacity="0.88" stroke="url(#shieldGrad)" stroke-width="5" filter="url(#softGlow)"/>

  <!-- Modern iPhone Silhouette with Dynamic Island -->
  <rect x="92" y="58" width="72" height="132" rx="14" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
  <rect x="114" y="65" width="28" height="6" rx="3" fill="#1e293b"/>

  <!-- Unlocked Shackle & Checkmark Badge inside iPhone Screen -->
  <path d="M115 108 V95 C115 86 121 80 129 80 C137 80 142 85 143 92"
        fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="108" y="108" width="40" height="34" rx="7" fill="url(#shieldGrad)"/>
  <path d="M120 125 L126 131 L138 119"
        fill="none" stroke="#0b1120" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Prompt ">_" Badge at Bottom of Device -->
  <rect x="103" y="152" width="50" height="24" rx="5" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M111 160 L117 164 L111 168" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="121" y1="168" x2="131" y2="168" stroke="#10b981" stroke-width="2.2" stroke-linecap="round"/>

  <!-- iOS 27 Pill Tag -->
  <rect x="148" y="176" width="58" height="24" rx="12" fill="#10b981" stroke="#0b1120" stroke-width="2.5"/>
  <text x="177" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#06121e" text-anchor="middle">iOS 27+</text>
</svg>
